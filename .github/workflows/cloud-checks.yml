name: Cloud preparation checks
on:
  push:
    branches: [main, "deployment/**"]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: tofes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d tofes_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/tofes_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: node --check backend/app/web/app.js
      - run: docker build -f Dockerfile.vercel -t tofes-web .
      - run: docker build -f Dockerfile.worker -t tofes-worker .
      - name: Verify runtime imports and OCR binary
        run: |
          docker run --rm --entrypoint python tofes-web -c "import app.api, app.cloud.worker, pypdfium2"
          docker run --rm --entrypoint tesseract tofes-worker --version
      - name: Verify only runtime files are packaged
        run: |
          for image in tofes-web tofes-worker; do
            docker run --rm --entrypoint python "$image" -c 'from pathlib import Path; root=Path("/app"); excluded=[".env", ".git", "backend/tests", "backend/app/main.py", "backend/app/evaluate.py", "samples", "evaluation", "work", "README.md", ".venv/bin/evaluate", ".venv/bin/serve"]; assert not any((root/p).exists() for p in excluded); required=["backend/app/api.py", "backend/app/twoforms.py", "backend/app/known.py", "backend/app/cloud/worker.py", "backend/app/prompts/extract_v3.md", "backend/app/web/app.js"]; assert all((root/p).is_file() for p in required)'
          done
      - name: Check authenticated HTTP server in the built image
        run: |
          docker run -d --name tofes-http -p 8080:80 \
            -e APP_ORIGIN=https://test.example \
            -e ACCESS_PASSWORD=test-password-with-more-than-24-characters \
            -e DATABASE_URL='postgresql://test:test@localhost:5432/tofes_test?sslmode=require' \
            -e SUPABASE_URL=https://test.supabase.co \
            -e SUPABASE_SERVICE_ROLE_KEY=test-only tofes-web
          for attempt in {1..30}; do
            if curl -s -o /dev/null http://localhost:8080/; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/pending)" = 401
          curl -fsS -u demo:test-password-with-more-than-24-characters \
            http://localhost:8080/api/config | python -c 'import sys,json; assert json.load(sys.stdin)["cloud_uploads"] is True'
          docker stop tofes-http
