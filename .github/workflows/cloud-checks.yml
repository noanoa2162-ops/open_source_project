name: Cloud preparation checks
on:
  push:
    branches: [main, "deployment/**"]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: tofes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d tofes_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/tofes_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: node --check backend/app/web/app.js
      - run: docker build -f Dockerfile.vercel -t tofes-web .
      - run: docker build -f Dockerfile.worker -t tofes-worker .
      - name: Verify runtime imports and OCR binary
        run: |
          docker run --rm --entrypoint python tofes-web -c "import app.api, app.cloud.worker, pypdfium2"
          docker run --rm --entrypoint tesseract tofes-worker --version
