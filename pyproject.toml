[project]
name = "commitment-extractor"
version = "0.3.0"
description = "Hackathon demo: drag a scanned commitment form in, get a reviewed Excel out"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "anthropic>=1.14",
    "pypdfium2>=4.30",
    "pillow>=10.4",
    "openpyxl>=3.1.5",
]

[project.scripts]
serve = "app.main:run"
evaluate = "app.evaluate:main"
gold-draft = "app.gold_draft:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
